<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIPS Exam Results Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="bg-[#1e3a8a] text-white py-6 shadow-md">
    <div class="container mx-auto px-4 text-center">
      <h1 class="text-3xl font-bold">Malabar Institute of Paramedical Science</h1>
      <p class="text-gray-200 mt-2">Official Exam Results Portal</p>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container mx-auto px-4 py-8 max-w-4xl">
    
    <!-- Search Section -->
    <div class="bg-white rounded-lg shadow-md p-6 mb-8 text-center" id="searchSection">
      <h2 class="text-2xl font-bold text-gray-800 mb-6">Check Your Results</h2>
      <div class="flex max-w-md mx-auto">
        <input type="text" id="admNumber" placeholder="Enter Admission Number (e.g., ADM-2026-0001)" 
          class="flex-1 border border-gray-300 rounded-l px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#1e3a8a]">
        <button id="searchBtn" class="bg-[#1e3a8a] text-white px-6 py-2 rounded-r hover:bg-[#172554] transition">
          Search
        </button>
      </div>
      <p id="errorMsg" class="text-red-500 mt-4 hidden">Student not found. Please check your Admission Number.</p>
    </div>

    <!-- Loading Indicator -->
    <div id="loading" class="text-center hidden py-8">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-[#1e3a8a] mx-auto"></div>
      <p class="mt-4 text-gray-600">Loading results database...</p>
    </div>

    <!-- Result Card -->
    <div id="resultCard" class="bg-white rounded-lg shadow-md overflow-hidden hidden">
      <div class="bg-[#1e3a8a] text-white px-6 py-4 flex justify-between items-center">
        <h3 class="text-xl font-bold" id="studentName">Student Name</h3>
        <span class="bg-white text-[#1e3a8a] px-3 py-1 rounded-full text-sm font-bold" id="examStatus">PASS</span>
      </div>
      
      <div class="p-6">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-6">
          <div>
            <p class="text-sm text-gray-500 uppercase">Admission No</p>
            <p class="font-bold text-lg" id="resAdmNo">-</p>
          </div>
          <div>
            <p class="text-sm text-gray-500 uppercase">Class Rank</p>
            <p class="font-bold text-lg" id="resRank">-</p>
          </div>
          <div>
            <p class="text-sm text-gray-500 uppercase">Total Marks</p>
            <p class="font-bold text-lg" id="resTotal">-</p>
          </div>
          <div>
            <p class="text-sm text-gray-500 uppercase">Percentage</p>
            <p class="font-bold text-lg" id="resPercent">-</p>
          </div>
        </div>
        
        <div class="border-t border-gray-200 pt-6 text-center">
          <p class="text-gray-600 mb-2">Overall Grade</p>
          <div class="inline-block px-8 py-4 rounded-lg bg-gray-50 border-2 border-gray-200">
            <span class="text-5xl font-black text-[#1e3a8a]" id="resGrade">A+</span>
          </div>
        </div>
        
        <div class="mt-8 text-center">
          <button onclick="window.print()" class="text-[#1e3a8a] border border-[#1e3a8a] px-4 py-2 rounded hover:bg-gray-50 transition">
            Print Result
          </button>
          <button onclick="resetSearch()" class="text-gray-600 ml-4 hover:underline">
            Search Another
          </button>
        </div>
      </div>
    </div>

  </main>

  <script>
    let resultsData = [];

    // Load JSON on startup
    async function fetchResults() {
      document.getElementById('loading').classList.remove('hidden');
      try {
        const response = await fetch('results.json');
        resultsData = await response.json();
      } catch (error) {
        console.error("Error loading results:", error);
      } finally {
        document.getElementById('loading').classList.add('hidden');
      }
    }

    // Search function
    document.getElementById('searchBtn').addEventListener('click', () => {
      const query = document.getElementById('admNumber').value.trim();
      if (!query) return;

      const result = resultsData.find(r => r.admission_number === query);
      
      const errorMsg = document.getElementById('errorMsg');
      const resultCard = document.getElementById('resultCard');
      const searchSection = document.getElementById('searchSection');

      if (result) {
        errorMsg.classList.add('hidden');
        searchSection.classList.add('hidden');
        
        // Populate
        document.getElementById('studentName').textContent = result.student_name;
        document.getElementById('resAdmNo').textContent = result.admission_number;
        document.getElementById('resRank').textContent = result.rank ? `#${result.rank}` : '-';
        document.getElementById('resTotal').textContent = result.total_marks;
        document.getElementById('resPercent').textContent = result.percentage.toFixed(2) + '%';
        document.getElementById('resGrade').textContent = result.grade;
        
        const statusEl = document.getElementById('examStatus');
        statusEl.textContent = result.status;
        if (result.status === 'Pass') {
          statusEl.className = 'bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm font-bold';
        } else {
          statusEl.className = 'bg-red-100 text-red-800 px-3 py-1 rounded-full text-sm font-bold';
        }

        resultCard.classList.remove('hidden');
      } else {
        errorMsg.classList.remove('hidden');
      }
    });

    function resetSearch() {
      document.getElementById('admNumber').value = '';
      document.getElementById('resultCard').classList.add('hidden');
      document.getElementById('searchSection').classList.remove('hidden');
    }

    // Initialize
    fetchResults();
  </script>
</body>
</html>
