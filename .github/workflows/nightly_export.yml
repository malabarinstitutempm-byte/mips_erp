name: MIPS ERP Nightly Backup & Disaster Recovery

on:
  schedule:
    # Runs every day at 02:00 UTC (07:30 AM IST)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary

      - name: Execute Nightly Export & Financial Audit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p backups
          python tools/nightly_export.py --output-dir backups --retention-days 30

      - name: Audit Backup Archive Integrity
        run: |
          LATEST_ZIP=$(ls -t backups/mips_export_*.zip | head -n 1)
          echo "Auditing: $LATEST_ZIP"
          python tools/verify_backup_integrity.py "$LATEST_ZIP"

      - name: Upload Backup Artifact to GitHub Storage
        uses: actions/upload-artifact@v4
        with:
          name: mips-database-nightly-backup
          path: backups/
          retention-days: 30
